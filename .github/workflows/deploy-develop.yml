name: Deploy develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Test
        run: go test ./...

  deploy:
    name: Deploy to Ubuntu
    runs-on: ubuntu-latest
    needs: test
    environment: develop
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      APP_DIR: ${{ secrets.APP_DIR }}
      PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          : "${APP_DIR:?Missing APP_DIR secret}"
          : "${PRODUCTION_ENV:?Missing PRODUCTION_ENV secret}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : "${SSH_PORT:=22}"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: |
          set -euo pipefail
          : "${SSH_PORT:=22}"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$APP_DIR'"

      - name: Upload environment file
        run: |
          set -euo pipefail
          : "${SSH_PORT:=22}"
          printf '%s\n' "$PRODUCTION_ENV" | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cat > '$APP_DIR/.env' && chmod 600 '$APP_DIR/.env'"

      - name: Deploy
        run: |
          set -euo pipefail
          : "${SSH_PORT:=22}"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "$APP_DIR/.git" ]; then
            rm -rf "$APP_DIR"
            git clone --branch develop https://github.com/majidhassani/Afra.git "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch origin develop
          git checkout develop
          git reset --hard origin/develop

          docker compose up --build -d
          docker image prune -f
          docker compose ps
          curl -fsS http://localhost:${HTTP_PORT:-8080}/health
          REMOTE
