name: Deploy develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Test
        run: go test ./...

  deploy:
    name: Deploy on self-hosted Ubuntu
    runs-on: [self-hosted, Linux, X64]
    needs: test
    environment: develop
    env:
      APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check runner tools
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          git --version

      - name: Prepare environment file
        run: |
          set -euo pipefail
          ENV_FILE="${APP_ENV_FILE:-/opt/afra/.env}"
          mkdir -p "$(dirname "$ENV_FILE")"

          if [ -n "${PRODUCTION_ENV:-}" ]; then
            printf '%s\n' "$PRODUCTION_ENV" > "$ENV_FILE"
          else
            test -f "$ENV_FILE"
          fi

          chmod 600 "$ENV_FILE"
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          set -euo pipefail
          docker compose --env-file "$ENV_FILE" -p afra up --build -d
          docker image prune -f
          docker compose --env-file "$ENV_FILE" -p afra ps

          PORT="$(grep -E '^HTTP_PORT=' "$ENV_FILE" | tail -1 | cut -d= -f2- || true)"
          PORT="${PORT:-8080}"
          curl -fsS "http://localhost:${PORT}/health"
