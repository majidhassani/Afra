openapi: 3.0.3
info:
  title: AgentVerse Mission Engine API
  version: 1.0.0
  description: Authenticated Go backend for AI-native map missions, wallet-guarded LLM actions, profiles, and legacy CaseMind compatibility.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Wallet
  - name: Missions
  - name: Map
  - name: Characters
  - name: Clues
  - name: Guidance
  - name: Time
  - name: Journal
  - name: Legacy Cases
paths:
  /health:
    get:
      tags: [Health]
      security: []
      responses:
        "200": { description: OK }
  /ready:
    get:
      tags: [Health]
      security: []
      responses:
        "200": { description: Dependencies are ready }
        "503": { description: A dependency is down }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Registered }
        "400": { description: Invalid input }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Logged in }
        "401": { description: Invalid credentials }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: Token refreshed }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: Logged out }
  /api/v1/me:
    get:
      tags: [Auth]
      responses:
        "200": { description: Current user }
  /api/v1/profile:
    get:
      tags: [Profile]
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/Profile" }
    put:
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, maxLength: 60 }
      responses:
        "200": { description: Updated profile }
  /api/v1/profile/stats:
    get:
      tags: [Profile]
      responses:
        "200": { description: Player statistics }
  /api/v1/profile/history:
    get:
      tags: [Profile]
      responses:
        "200": { description: Mission history }
  /api/v1/profile/badges:
    get:
      tags: [Profile]
      responses:
        "200": { description: Player badges }
  /api/v1/wallet:
    get:
      tags: [Wallet]
      responses:
        "200":
          description: Wallet balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet: { $ref: "#/components/schemas/Wallet" }
  /api/v1/wallet/transactions:
    get:
      tags: [Wallet]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200": { description: Wallet transactions }
  /api/v1/wallet/pricing:
    get:
      tags: [Wallet]
      responses:
        "200": { description: Server-side pricing rules }
  /api/v1/wallet/config:
    get:
      tags: [Wallet]
      summary: Wallet demo/production state and store catalog
      description: >
        Exposes whether demo purchases/ads are enabled in this environment and
        the purchasable coin packs. Real balance, pricing, and AI charging are
        always active regardless of this flag.
      responses:
        "200":
          description: Wallet configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  demo_purchases: { type: boolean }
                  rewarded_ad_coins: { type: integer }
                  coin_packs:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id: { type: string }
                        coins: { type: integer }
  /api/v1/wallet/rewarded-ad/claim:
    post:
      tags: [Wallet]
      summary: Claim the daily rewarded-ad bonus (demo-gated)
      description: >
        Credits the fixed rewarded-ad payout, enforcing a server-side daily
        cap. Disabled (409 demo_disabled) when demo purchases are off.
      responses:
        "200": { description: Reward credited }
        "409": { description: Daily limit reached or demo disabled }
  /api/v1/wallet/purchase/verify:
    post:
      tags: [Wallet]
      summary: Verify a store purchase (demo/mock, gated in production)
      description: >
        Records the receipt (deduplicated) and credits the product coins.
        Store-side receipt verification is a placeholder; disabled
        (409 demo_disabled) when demo purchases are off (default in production).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, product_id, receipt]
              properties:
                platform: { type: string, enum: [ios, android] }
                product_id: { type: string, enum: [coins_small, coins_medium, coins_large] }
                receipt: { type: string }
      responses:
        "200": { description: Purchase credited }
        "409": { description: Receipt already used }
  /api/v1/avatars/options:
    get:
      tags: [Characters]
      summary: Available avatar generation options
      responses:
        "200": { description: Styles, genders, and age groups }
  /api/v1/avatars/generate:
    post:
      tags: [Characters]
      summary: Generate an avatar image
      description: Uses the image API when configured, otherwise the built-in procedural generator.
      responses:
        "200": { description: Generated avatar (base64 PNG) }
  /api/v1/missions:
    post:
      tags: [Missions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMissionRequest" }
      responses:
        "202": { description: Mission accepted for generation }
        "409": { description: Insufficient wallet balance }
    get:
      tags: [Missions]
      responses:
        "200": { description: User missions }
  /api/v1/missions/{missionID}:
    get:
      tags: [Missions]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200": { description: Mission dashboard }
        "404": { description: Not found or not owned }
  /api/v1/missions/{missionID}/dashboard:
    get:
      tags: [Missions]
      summary: Structured mission dashboard
      description: >
        Objectives (primary/required/optional/final), deterministic mission
        progress and risk scores, time remaining, next recommended actions,
        win/loss hints, annotated map markers, and completion readiness.
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200":
          description: Structured mission state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionDashboard" }
        "404": { description: Not found or not owned }
  /api/v1/missions/{missionID}/completion-check:
    get:
      tags: [Missions]
      summary: Whether the mission can be completed yet
      description: Returns can_complete and, when false, the missing requirements. Never charged.
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200":
          description: Completion readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletionCheck" }
  /api/v1/missions/{missionID}/complete:
    post:
      tags: [Missions]
      summary: Submit the final mission decision
      description: >
        Gates on readiness (returns 409 with missing requirements when not
        ready), otherwise runs the JudgeAgent and returns the win/loss result
        with objective- and clue-level explanation, stars, XP, and coins.
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome: { type: string }
                reasoning: { type: string }
      responses:
        "200":
          description: Judged mission result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionResult" }
        "409": { description: Not ready to complete — missing requirements }
  /api/v1/missions/{missionID}/archive:
    post:
      tags: [Missions]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200": { description: Mission archived }
  /api/v1/missions/{missionID}/events:
    get:
      tags: [Missions]
      summary: Raw chronological mission event feed (dev/detail)
      description: >
        Raw mission events, newest first. Clients building the player-facing
        story should prefer GET /missions/{missionID}/timeline.
      parameters:
        - { $ref: "#/components/parameters/MissionID" }
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 200 }
      responses:
        "200": { description: Mission event log }
  /api/v1/missions/{missionID}/timeline:
    get:
      tags: [Missions]
      summary: Curated player-facing mission timeline
      description: >
        The official story timeline: normalized event categories
        (mission_started, location_visited, clue_discovered, character_talked,
        ai_guidance_received, time_advanced, objective_completed, ...),
        oldest first, built only from player-safe event payloads. Internal
        noise (generation progress, raw facts, pacing hints) never appears.
      parameters:
        - { $ref: "#/components/parameters/MissionID" }
        - in: query
          name: limit
          schema: { type: integer, default: 200, maximum: 200 }
      responses:
        "200":
          description: Curated timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineView" }
        "404": { description: Not found or not owned }
  /api/v1/missions/{missionID}/stream:
    get:
      tags: [Missions]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200": { description: Server-sent mission events }
  /api/v1/missions/{missionID}/map:
    get:
      tags: [Map]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200":
          description: Google Maps-compatible markers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapView" }
  /api/v1/missions/{missionID}/locations/{locationID}:
    get:
      tags: [Map]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/LocationID" } ]
      responses:
        "200": { description: Location bottom-sheet detail }
        "404": { description: Hidden or missing location }
  /api/v1/missions/{missionID}/locations/{locationID}/actions:
    post:
      tags: [Map]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/LocationID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, example: inspect_area }
      responses:
        "200": { description: Action result and discovered clues }
  /api/v1/missions/{missionID}/locations/{locationID}/ask-ai:
    post:
      tags: [Guidance]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/LocationID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "200": { description: Location-scoped AI guidance }
  /api/v1/missions/{missionID}/characters:
    get:
      tags: [Characters]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200":
          description: Public NPC list
          content:
            application/json:
              schema:
                type: object
                properties:
                  characters:
                    type: array
                    items: { $ref: "#/components/schemas/PublicCharacter" }
  /api/v1/missions/{missionID}/characters/{characterID}:
    get:
      tags: [Characters]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/CharacterID" } ]
      responses:
        "200": { description: Public NPC detail and transcript }
  /api/v1/missions/{missionID}/characters/{characterID}/chat:
    post:
      tags: [Characters]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/CharacterID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                location_id: { type: string, format: uuid }
      responses:
        "200":
          description: NPC reply, state deltas, and cost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResult" }
  /api/v1/missions/{missionID}/characters/{characterID}/avatar:
    post:
      tags: [Characters]
      summary: Generate and persist a character avatar
      description: >
        Renders an avatar (image API or procedural fallback), stores it as a
        data URL, and returns the public character with avatar_url/avatar_status
        set. On generation failure avatar_status becomes "unavailable" so the
        client shows a placeholder instead of blocking. Never returns prompts.
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/CharacterID" } ]
      responses:
        "200":
          description: Character with avatar wired
          content:
            application/json:
              schema:
                type: object
                properties:
                  character: { $ref: "#/components/schemas/PublicCharacter" }
  /api/v1/missions/{missionID}/clues/{clueID}/image:
    post:
      tags: [Clues]
      summary: Generate and persist a clue evidence image
      description: >
        Renders an evidence image, stores it as a data URL, and returns the
        public clue with image_url/image_status set. Never returns prompts.
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/ClueID" } ]
      responses:
        "200":
          description: Clue with image wired
          content:
            application/json:
              schema:
                type: object
                properties:
                  clue: { $ref: "#/components/schemas/PublicClue" }
  /api/v1/missions/{missionID}/clues:
    get:
      tags: [Clues]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200":
          description: Discovered clues only
          content:
            application/json:
              schema:
                type: object
                properties:
                  clues:
                    type: array
                    items: { $ref: "#/components/schemas/PublicClue" }
  /api/v1/missions/{missionID}/clues/{clueID}:
    get:
      tags: [Clues]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/ClueID" } ]
      responses:
        "200": { description: Public clue detail }
  /api/v1/missions/{missionID}/clues/{clueID}/inspect:
    post:
      tags: [Clues]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/ClueID" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string }
      responses:
        "200":
          description: Paid clue inspection
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis: { type: string }
                  new_facts:
                    type: array
                    items: { type: string }
                  clue: { $ref: "#/components/schemas/PublicClue" }
                  cost: { $ref: "#/components/schemas/Cost" }
  /api/v1/missions/{missionID}/clues/{clueID}/explain:
    post:
      tags: [Clues]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/ClueID" } ]
      responses:
        "200":
          description: Paid clue explanation using public data only
          content:
            application/json:
              schema:
                type: object
                properties:
                  explanation: { type: string }
                  next_steps:
                    type: array
                    items: { type: string }
                  compare_with:
                    type: array
                    items: { type: string }
                  cost: { $ref: "#/components/schemas/Cost" }
  /api/v1/missions/{missionID}/guidance:
    post:
      tags: [Guidance]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuidanceRequest" }
      responses:
        "200":
          description: Paid hint response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuidanceResult" }
  /api/v1/missions/{missionID}/time:
    get:
      tags: [Time]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200": { description: Mission clock and public state }
  /api/v1/missions/{missionID}/time/advance:
    post:
      tags: [Time]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, unit]
              properties:
                amount: { type: integer, minimum: 1 }
                unit: { type: string, enum: [minutes, hours, days] }
      responses:
        "200": { description: Time advanced with public consequences }
  /api/v1/missions/{missionID}/journal:
    get:
      tags: [Journal]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      responses:
        "200": { description: Journal notes }
    post:
      tags: [Journal]
      parameters: [ { $ref: "#/components/parameters/MissionID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalNoteRequest" }
      responses:
        "201": { description: Journal note created }
  /api/v1/missions/{missionID}/journal/{noteID}:
    put:
      tags: [Journal]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/NoteID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalNoteRequest" }
      responses:
        "200": { description: Journal note updated }
    delete:
      tags: [Journal]
      parameters: [ { $ref: "#/components/parameters/MissionID" }, { $ref: "#/components/parameters/NoteID" } ]
      responses:
        "204": { description: Journal note deleted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MissionID: { in: path, name: missionID, required: true, schema: { type: string, format: uuid } }
    LocationID: { in: path, name: locationID, required: true, schema: { type: string, format: uuid } }
    CharacterID: { in: path, name: characterID, required: true, schema: { type: string, format: uuid } }
    ClueID: { in: path, name: clueID, required: true, schema: { type: string, format: uuid } }
    NoteID: { in: path, name: noteID, required: true, schema: { type: string, format: uuid } }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        display_name: { type: string, maxLength: 60 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    CreateMissionRequest:
      type: object
      required: [type, difficulty]
      properties:
        type:
          type: string
          enum: [detective, wildlife_rescue, disaster_response, exploration, survival, diplomacy, medical_mystery]
        difficulty:
          type: string
          enum: [easy, medium, hard, expert]
        region: { type: string, example: Tehran }
        language: { type: string, enum: [en, fa], default: en }
    GuidanceRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 2000 }
        context:
          type: object
          properties:
            screen: { type: string, example: map }
            location_id: { type: string, format: uuid, nullable: true }
            selected_clue_id: { type: string, format: uuid, nullable: true }
    JournalNoteRequest:
      type: object
      required: [content]
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 10000 }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        rank: { type: string }
        level: { type: integer }
        xp: { type: integer }
        total_missions: { type: integer }
        completed_missions: { type: integer }
        failed_missions: { type: integer }
        success_rate: { type: number }
        favorite_mission_type: { type: string }
        total_clues_found: { type: integer }
        total_ai_interactions: { type: integer }
        total_locations_visited: { type: integer }
        badges: {}
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Wallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        balance: { type: integer }
        reserved_balance: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Cost:
      type: object
      properties:
        coins_charged: { type: integer }
    Objective:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [primary, required, optional, hidden, dynamic, final] }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [locked, active, completed, failed, skipped] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        required_clues: { type: integer }
        optional: { type: boolean }
    PublicCharacter:
      type: object
      description: >
        The only character shape returned to clients. Generation prompts and
        private state never appear here.
      properties:
        id: { type: string, format: uuid }
        mission_id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }
        category: { type: string }
        age: { type: integer }
        public_profile: { type: string }
        personality: {}
        current_location_id: { type: string, format: uuid, nullable: true }
        trust_level: { type: integer }
        mood: { type: string }
        avatar_url: { type: string }
        avatar_status: { type: string, enum: [none, pending, ready, unavailable] }
        visual_style_tags: {}
    PublicClue:
      type: object
      description: >
        The only clue shape returned to clients. Generation prompts and
        internal truth never appear here.
      properties:
        id: { type: string, format: uuid }
        mission_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        type: { type: string }
        short_description: { type: string }
        detailed_description: { type: string }
        visual_description: { type: string }
        image_url: { type: string }
        image_status: { type: string, enum: [none, pending, ready, unavailable] }
        discovered: { type: boolean }
        reliability: { type: integer }
        importance: { type: string }
        related_character_ids: {}
        public_data: {}
        created_at: { type: string, format: date-time }
    Marker:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        lat: { type: number }
        lng: { type: number }
        status: { type: string, enum: [hidden, discovered, locked, visited] }
        risk_level: { type: integer }
        has_new_clue: { type: boolean }
        has_character: { type: boolean }
        is_locked: { type: boolean }
        badge: { type: string }
        objective_status: { type: string, enum: [available, active, completed, high_risk] }
        has_required_action: { type: boolean }
        recommended: { type: boolean }
        priority: { type: string, enum: [high, medium, low] }
    MapView:
      type: object
      properties:
        mission_id: { type: string, format: uuid }
        center:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
        zoom: { type: integer }
        locations:
          type: array
          items: { $ref: "#/components/schemas/Marker" }
    TimelineItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum:
            - mission_started
            - location_visited
            - clue_discovered
            - clue_inspected
            - character_talked
            - ai_guidance_received
            - time_advanced
            - risk_changed
            - objective_completed
            - objective_failed
            - new_location_unlocked
            - mission_ready_to_complete
            - mission_completed
            - mission_failed
            - world_event
        title: { type: string }
        description: { type: string }
        mission_time: { type: string, example: "Day 1 — 09:30" }
        occurred_at: { type: string, format: date-time }
        location_id: { type: string, format: uuid, nullable: true }
        related_clue_id: { type: string, format: uuid, nullable: true }
        related_character_id: { type: string, format: uuid, nullable: true }
        importance: { type: string, enum: [high, medium, low] }
    TimelineView:
      type: object
      properties:
        mission_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineItem" }
    RecommendedAction:
      type: object
      properties:
        type: { type: string, example: visit_location }
        title: { type: string }
        description: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        priority: { type: string, enum: [high, medium, low] }
        cost_hint: { type: string }
    MissionDashboard:
      type: object
      properties:
        mission: {}
        mission_id: { type: string, format: uuid }
        title: { type: string }
        mission_status: { type: string }
        primary_objective: { $ref: "#/components/schemas/Objective" }
        objectives:
          type: array
          items: { $ref: "#/components/schemas/Objective" }
        completed_objectives:
          type: array
          items: { $ref: "#/components/schemas/Objective" }
        mission_progress: { type: integer, minimum: 0, maximum: 100 }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        current_time: { type: string }
        time_remaining: { type: string }
        has_deadline: { type: boolean }
        next_recommended_actions:
          type: array
          items: { $ref: "#/components/schemas/RecommendedAction" }
        win_conditions:
          type: array
          items: { type: string }
        failure_conditions:
          type: array
          items: { type: string }
        can_complete: { type: boolean }
        missing_requirements:
          type: array
          items: { type: string }
        characters:
          type: array
          items: { $ref: "#/components/schemas/PublicCharacter" }
        clues:
          type: array
          items: { $ref: "#/components/schemas/PublicClue" }
        locations:
          type: array
          items: { $ref: "#/components/schemas/Marker" }
        timeline_preview:
          type: array
          items: {}
        wallet_balance: { type: integer }
        result: {}
    CompletionCheck:
      type: object
      properties:
        can_complete: { type: boolean }
        reason: { type: string }
        missing_requirements:
          type: array
          items: { type: string }
    MissionResult:
      type: object
      properties:
        can_complete: { type: boolean }
        success: { type: boolean }
        score: { type: integer }
        stars: { type: integer, minimum: 0, maximum: 5 }
        result_title: { type: string }
        result_summary: { type: string }
        completed_objectives:
          type: array
          items: { type: string }
        failed_objectives:
          type: array
          items: { type: string }
        missed_optional_objectives:
          type: array
          items: { type: string }
        critical_clues_found:
          type: array
          items: { type: string }
        critical_clues_missed:
          type: array
          items: { type: string }
        good_decisions:
          type: array
          items: { type: string }
        bad_decisions:
          type: array
          items: { type: string }
        xp_reward: { type: integer }
        coin_reward: { type: integer }
        cost: { $ref: "#/components/schemas/Cost" }
    GuidanceResult:
      type: object
      properties:
        message: { type: string }
        hint_level: { type: string }
        referenced_items:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [location, clue, character, objective] }
              id: { type: string }
              name: { type: string }
        cost: { $ref: "#/components/schemas/Cost" }
    ChatResult:
      type: object
      properties:
        message: { type: string }
        emotion: { type: string }
        mood: { type: string }
        trust_level: { type: integer }
        trust_delta: { type: integer }
        stress_delta: { type: integer }
        unlocked_clues:
          type: array
          items: { $ref: "#/components/schemas/PublicClue" }
        new_facts:
          type: array
          items: { type: string }
        cost: { $ref: "#/components/schemas/Cost" }
